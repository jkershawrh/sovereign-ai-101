    claim: Specific fresh events for the current cases are present in the ledger.
    collection: Capture GET /api/ledger before and after serial synthetic cases; compare new entry IDs and inspect event type, short case marker, payload and time. Do not infer correlation from timestamps alone.
    fields: [session_id, case_id, collected_at, source_state, entry_id, entry_type, correlation_id, entry_hash, previous_hash, chain_position, written_ts, content]
    owner: Future presentation adapter and reviewer
    last_verified: null
    treatment: Adapter correlation is not returned to caller; ambiguous or missing matches block an evidence-complete payoff. Policy bridge entries need payload matching and isolated test conditions.
  - id: L04
    classification: live-measurement
    collection_status: not-collected
    claim: Chains containing this session's observed entries pass the implemented integrity check.
    collection: GET /api/ledger/verify after L03; retain raw per-chain result and nonzero entries_checked for every relevant event type.
    fields: [session_id, collected_at, source_state, all_valid, chains, matched_entry_ids]
    owner: Future presentation adapter and reviewer
    last_verified: null
    treatment: Empty chains, unrelated historical events or all_valid alone are insufficient; no automatic sovereignty/compliance score.
decisions:
  - id: D-route
    owner: Prompt adapter deterministic code
    inputs: Last user text and fixed regex/rule configuration
    action: Classify general/sensitive/injection; block matching injection after OPA check; otherwise use configured backend.
    fail_closed: false
    limits: Pattern matching is not comprehensive injection protection; /classify is diagnostic only.
    evidence_ids: [E02]
  - id: D-policy
    owner: Human-authored Rego, evaluated by OPA
    inputs: Caller-supplied destination and classification
    action: Explicit false blocks chat; local is allowed by reviewed policy.
    fail_closed: false
    limits: Policy itself defaults deny; adapter's transport/missing-result handling allows. Hard-coded local input does not measure destination.
    evidence_ids: [E02, E03]
  - id: D-record
    owner: Adapter/demo API attempt writes; ledger stores and verifies
    action: Record decision metadata without granting or revoking model authority.
    fail_closed: false
    limits: Recording failure does not stop inference or policy result; no mandatory successful receipt.
    evidence_ids: [E01, E02, E06, E07]
  - id: D-accept
    owner: Human platform/security reviewer
    inputs: Current session source state and L00-L04, with B01-B08 limitations
    action: Accept a narrowly demonstrated behavior, reject an unsupported claim, or continue to lab.
    fail_closed: true
    limits: This is a presentation acceptance rule, not an implemented runtime control. Missing evidence must withhold the claim.
    evidence_ids: [E10, L00, L01, L02, L03, L04]
ai_assessment:
  needed: optional
  kind: generative-llm
  rationale: Generation requires Granite; classification, OPA decisions, ledger verification and human governance interpretation do not.
  tasks: [Generate a short answer to the permitted synthetic user prompt]
  inputs:
    - Demo API constructs one user message; adapter forwards messages, configured MODEL and max_tokens to BACKEND.
    - No retrieved context, ledger evidence or OPA reasoning is inserted into the model prompt by this path.
  outputs: [Chat completion text and backend model field]
  model_identity_source: E05 selects ibm-granite/granite-3.2-2b-instruct; alias granite-3.2-sovereign; L00 must verify actual loaded artifacts.
  hardware_identity_source: L00 required; manifests do not establish Intel CPU placement or confidential computing.
  evidence_access: User message content only in selected demo path; no ledger retrieval or policy tool access.
  action_authority: Text generation only; cannot select destination, edit policy, write ledger events, execute tools or authorize infrastructure changes.
  validation:
    - Adapter gates request before generation; generation has no semantic output validator in this path.
    - Demo API reads choices[0].message.content; malformed or unavailable responses cannot support a successful inference claim.
    - Human reviews answer content separately from policy outcome and ledger integrity.
  fallback: Backend failure returns HTTP 502; no automatic alternate model or canned successful answer. Presentation may use an explicitly labeled REHEARSAL fixture only after one is authored and reviewed, otherwise OFFLINE with proof not run. Policy-only results never imply Granite participated.
  final_decision_owner: Human platform/security reviewer
  evidence_ids: [E01, E02, E05]
story_mapping:
  audience_question: What can we actually verify about this locally governed AI request?
  stakes:
    - A plausible answer does not establish deployment identity or policy enforcement.
    - Missing evidence and fail-open behavior limit what the operator can claim.
  architecture_flow_ids: [F-inference, F-policy-comparison, F-ledger]
  live_proof_flow_ids: [F-inference, F-policy-comparison, F-ledger]
  comparison: General versus injection prompt; separately local versus foreign-sensitive policy input.
  payoff: Populate only from current session L00-L04; distinguish observed, rejected, missing and unproven. Human explains limits without a sovereignty score.
  next_journey: Continue to the companion 36-minute lab contract with four-minute recovery allowance after G01-G10 pass; until then use selected existing guide exercises only as instructor-led inspection, preserving evidence and exclusions.
  lab_handoff:
    evidence_ids: [E08, E11]
    current_source: General/sensitive completion or injection rejection; policy comparison separate; marker-based serial inspection is provisional and may remain ambiguous.
    future_contract: Session-bound request/correlation IDs, required decision/completion receipts, allow/deny/abstain outcomes, controlled OPA outage, exact receipt verification and scoped cleanup.
    acceptance: Future general and sensitive cases complete, injection denies, OPA outage abstains; require exact fresh receipts and relevant nonempty valid chains plus human ownership explanation.
    limit: Existing fail-open adapter cannot pass the abstention contract. Mark learner handoff blocked until companion matrix G01-G10 is satisfied; do not make source-derived diagnostic matching the final learner contract.
