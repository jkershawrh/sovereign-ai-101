  - {name: 'Demo API /api/route', evidence_ids: [L01], readiness: unverified}
  - {name: 'Demo API /api/policies/evaluate', evidence_ids: [L02], readiness: unverified}
  - {name: 'Demo API /api/ledger and /api/ledger/verify', evidence_ids: [L03, L04], readiness: unverified}
journey:
  presentation: Six scenes, four acts, 390 seconds; one viewport per desktop reveal.
  live_demonstration: 5–10 minutes to repeat paired cases and inspect raw source-labeled evidence.
  guided_demo:
    duration_minutes: 25
    destination: Existing lab's inference, data-residency policy and proof-chain inspection surfaces.
    source_pages:
      - content/modules/ROOT/pages/04-inference-routing.adoc
      - content/modules/ROOT/pages/05-policy-enforcement.adoc
      - content/modules/ROOT/pages/explore-proof-chain.adoc
    selection: Inference exercises 1–4; policy exercises 1–2; inspect router event types and relevant chains instead of TDX or seven-layer claims.
    caveat: Guide includes broader claims and direct OPA calls without ledger writes. Instructor must explain those limits; current task leaves guide content unchanged.
  hands_on_lab:
    proposed_duration_minutes: 36
    recovery_allowance_minutes: 4
    contract: docs/sovereign-ai-101-lab-plan.md
    acceptance_matrix: docs/journey-acceptance-matrix.md
    status: future-state; bounded exercise plan, not a certified or provisioned seat
    outcome: After G01-G10 pass, run general and sensitive allow, injection deny and controlled OPA-unavailable abstain; verify exact fresh receipts and relevant chains, explain human ownership, and complete scoped cleanup.
    implementation_limit: Abstention, mandatory receipts, completion events and public correlation IDs are future contract features; existing adapter fails open and cannot qualify this lab.
    evidence_ids: [E08, E11]
    takeaway: Source revision/dirty state, runtime identities, selected conditions, request/session/correlation IDs, returned receipt hashes, chain result, ownership explanation and cleanup record.
    continuity: Carry presentation evidence as context; allocate fresh learner IDs and baselines. Provisional marker matching in the current demo is not the future learner correlation contract.
  state_to_preserve: [session_id, source_revision, source_dirty, source_state, collected_at, selected_conditions, raw_results, entry_ids, entry_hashes, verification_results, unresolved_gaps]
release_gates:
  - Blueprint blockers B01-B08 must remain visible; production authority claims require separate hardening and validation.
  - Verify Intel CPU, effective local OVMS endpoint, model identity and deployed policy before labeling the run live.
  - Validate actual typed adapter responses and reviewed fixtures; a failed or unrun proof cannot render a success payoff.
  - Require new matching ledger entries and nonempty relevant chain verification; retain ambiguity instead of guessing.
  - Resolve deployment path drift and qualify a lab seat before calling the handoff turnkey.
  - Future scene implementation must preserve keyboard access, reduced motion, source labels and 1920x1080/1440x900 one-viewport layouts.
