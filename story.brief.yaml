  consequential_assumptions:
    - Local full-mode OVMS on verified Intel CPU is the live target, not yet observed in this review.
    - Current endpoint, image/model identity and fresh request evidence must be supplied before live presentation.
    - No app scene, typed browser adapter or rehearsal fixture was authored by this document-only task.
architecture:
  actors: [operator, reviewer]
  boundaries: [B-input, B-policy, B-model, B-evidence, B-human]
  critical_flows: [F-inference, F-policy-comparison, F-ledger]
  reveal_sequence:
    - 'Who receives the prompt? Demo API constructs the user message.'
    - 'Who decides? GCL rules classify; OPA evaluates supplied metadata.'
    - 'Who generates? The configured local Granite/OpenVINO/OVMS endpoint.'
    - 'What remains to inspect? Ledger entries and chain results, judged by a human.'
  omitted_from_main_story: [TDX, confidential-computing, model-adaptation, benchmarks, ContextForge, Praxis, MCP, remote-MaaS, autonomous-remediation]
  partner_roles: Red Hat OpenShift supplies the intended operating surface; Intel OpenVINO/OVMS supplies conversion and serving on the target Intel CPU. Granite is IBM's model. Preserve Red Hat × Intel lockup without product-support or superiority claims.
