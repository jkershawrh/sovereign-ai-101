evidence:
  authority: Blueprint evidence catalog E01-E10 defines reviewed source claims; L00-L04 defines uncollected runtime contracts.
  source_claims: verified-fact means inspected source, not a successful live test.
  live_claims: Every result carries session_id, case_id where relevant, collection time and LIVE/REHEARSAL/OFFLINE state. Preserve raw responses and matched ledger identifiers.
  fallback: No approved rehearsal fixture exists yet. If services fail, show OFFLINE and proof not run. Any future fixture must be reviewed and visibly REHEARSAL with provenance; never mix it into a live payoff.
  metrics: No authored confidence, latency, throughput, cost or benchmark metrics. Fixed classifier confidence is not model quality.
  inference_limit: A routed_local event precedes the model call; it does not prove successful generation.
  ledger_limit: Best-effort writes, unsigned caller identity and ambiguous correlation remain visible. Chain integrity does not prove completeness or claim truth.
live_systems:
