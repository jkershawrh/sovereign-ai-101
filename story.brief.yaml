presentation:
  title: Sovereign AI 101 — Verify Local Inference Governance
  audience: Platform and AI engineers, security reviewers, and technical decision makers
  desired_decision: Select one workload for a bounded lab that tests inference, policy behavior and evidence completeness.
  duration_minutes: 6.5
  core_tension: A useful AI answer does not tell us where it ran, which rule decided, or what was recorded.
  cta: Inspect this request in the guided lab, then define the evidence your workload needs.
  framing: A source-backed governance demonstration; sovereignty is the question under examination, not a certified outcome.
