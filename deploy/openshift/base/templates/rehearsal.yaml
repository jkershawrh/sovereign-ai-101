apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-rehearsal
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/name: sovereign-rehearsal
  annotations:
    sovereign.ai/resources: Development proposal only; unmeasured, not a capacity or certification result.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-rehearsal
  template:
    metadata:
      labels:
        {{- include "sovereign.labels" . | nindent 8 }}
        app.kubernetes.io/name: sovereign-rehearsal
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rehearsal
          image: {{ required "workload_image is required" .Values.workload_image | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: SOVEREIGN_SOURCE
              value: {{ .Values.source_state | quote }}
            - name: DELIVERY_STATUS
              value: development
            - name: PORT
              value: "8787"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-rehearsal
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/name: sovereign-rehearsal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sovereign-rehearsal
  ports:
    - name: http
      port: 8787
      targetPort: http
