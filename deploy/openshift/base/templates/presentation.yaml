apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-presentation
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/name: sovereign-presentation
  annotations:
    sovereign.ai/resources: Development proposal only; unmeasured, not a capacity or certification result.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-presentation
  template:
    metadata:
      labels:
        {{- include "sovereign.labels" . | nindent 8 }}
        app.kubernetes.io/name: sovereign-presentation
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: presentation
          image: {{ required "presentation_image is required" .Values.presentation_image | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SOVEREIGN_SOURCE
              value: {{ .Values.source_state | quote }}
            - name: DELIVERY_STATUS
              value: development
            - name: PORT
              value: "8080"
            - name: SERVICE_URL
              value: http://sovereign-rehearsal:8787
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-presentation
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
    app.kubernetes.io/name: sovereign-presentation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sovereign-presentation
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sovereign-presentation
  labels:
    {{- include "sovereign.labels" . | nindent 4 }}
spec:
  host: {{ printf "s101-%s.%s" (.Release.Namespace | sha256sum | trunc 12) .Values.apps_domain | quote }}
  to:
    kind: Service
    name: sovereign-presentation
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
