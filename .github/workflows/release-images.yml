name: Sovereign AI 101 immutable images

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source revision to build
        required: true
        type: string
      publish:
        description: Publish, sign, and attest after all gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Refuse revision drift
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -z "$(git status --porcelain)"
      - run: npm ci --ignore-scripts
      - run: npm --prefix showroom ci --ignore-scripts
      - run: npm run check

  release:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: presentation
            containerfile: Containerfile
            repository: ghcr.io/${{ github.repository_owner }}/sovereign-ai-101-presentation
          - component: rehearsal
            containerfile: Containerfile.service
            repository: ghcr.io/${{ github.repository_owner }}/sovereign-ai-101-rehearsal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Refuse revision drift
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build exact Linux AMD64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.containerfile }}
          platforms: linux/amd64
          load: true
          push: false
          no-cache: true
          tags: ${{ matrix.repository }}:git-${{ inputs.expected_sha }}
          build-args: |
            SOURCE_REVISION=${{ inputs.expected_sha }}
            SOURCE_DIRTY=false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.expected_sha }}
      - name: Inventory vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: ${{ matrix.repository }}:git-${{ inputs.expected_sha }}
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: vulnerability-${{ matrix.component }}.json
      - name: Block fixable high and critical vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          image: ${{ matrix.repository }}:git-${{ inputs.expected_sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: vulnerability-fixable-${{ matrix.component }}.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ matrix.repository }}:git-${{ inputs.expected_sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
      - name: Retain pre-publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereign-ai-101-${{ matrix.component }}-${{ inputs.expected_sha }}
          retention-days: 90
          path: |
            vulnerability-${{ matrix.component }}.json
            vulnerability-fixable-${{ matrix.component }}.json
            sbom-${{ matrix.component }}.spdx.json
      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable candidate
        if: ${{ inputs.publish }}
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          image="${{ matrix.repository }}:git-${{ inputs.expected_sha }}"
          docker push "$image"
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          test -n "$digest_ref"
          digest="${digest_ref##*@}"
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest_ref" > image-${{ matrix.component }}.txt
      - name: Install Cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Sign exact digest with GitHub OIDC
        if: ${{ inputs.publish }}
        env:
          DIGEST_REF: ${{ steps.publish.outputs.digest_ref }}
        run: cosign sign --yes "$DIGEST_REF"
      - name: Attest build provenance
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
      - name: Retain digest identity
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereign-ai-101-digest-${{ matrix.component }}-${{ inputs.expected_sha }}
          retention-days: 90
          path: image-${{ matrix.component }}.txt
